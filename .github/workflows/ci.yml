name: CI/CD DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 1. Análisis Estático con SonarQube
    - name: SonarQube Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 
        # Nota: Deberás configurar SONAR_TOKEN en los Secrets de tu repo en GitHub

    # 2. Escaneo de Vulnerabilidades con Snyk
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/python@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        # Nota: Deberás configurar SNYK_TOKEN en los Secrets de tu repo en GitHub
      with:
        command: monitor

    # 3. Construcción de la imagen Docker
    - name: Build Docker Image
      run: |
        docker build -t mi-app-nlp:${{ github.sha }} .